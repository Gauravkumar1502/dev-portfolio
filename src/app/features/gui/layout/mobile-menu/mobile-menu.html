<div class="mobile-menu">
  <div class="mobile-menu__top">
    <h2 id="mobile-menu-title" class="sr-only">Menu</h2>
    <button
      type="button"
      nb-button
      variant="outline"
      size="sm"
      aria-label="Close menu"
      (click)="close()"
    >
      <app-icon name="close" [size]="18" />
    </button>
  </div>

  <nav aria-label="Mobile">
    <ol class="mobile-menu__links">
      @for (link of links; track link.fragment) {
        <li>
          <a class="mobile-menu__fn" routerLink="/" [fragment]="link.fragment" (click)="close()">{{
            link.label
          }}</a>
        </li>
      }
      <li>
        <a
          class="mobile-menu__fn"
          routerLink="/terminal"
          aria-label="Open terminal portfolio"
          (click)="close()"
        >
          .open(<span class="mobile-menu__arg">'terminal'</span>)
        </a>
      </li>
    </ol>
  </nav>

  <div class="mobile-menu__bottom">
    <div class="mobile-menu__connect">
      <span class="mobile-menu__fn-name" aria-hidden="true">.connect(</span>
      <app-social-links [iconSize]="20" />
      <span class="mobile-menu__fn-name" aria-hidden="true">)</span>
    </div>

    <a class="mobile-menu__fn mobile-menu__fn--small" [href]="mailto()">
      .mailTo(<span class="mobile-menu__arg">'{{ email() }}'</span>)
    </a>

    <button
      type="button"
      class="mobile-menu__fn mobile-menu__switch"
      [attr.aria-label]="theme.isGuiDark() ? 'Switch to light theme' : 'Switch to dark theme'"
      (click)="theme.toggleGuiTheme()"
    >
      .switchTo(<app-icon
        class="mobile-menu__arg"
        [name]="theme.isGuiDark() ? 'sun' : 'moon'"
        [size]="18"
      />)
    </button>
  </div>
</div>
